# Pytest is scoped to VentureGPS V2 tests ONLY.
#
# - `testpaths` makes a bare `pytest` collect app/v2/tests and nothing else.
# - The repo-root conftest.py refuses any explicit path outside app/v2
#   (pytest does not apply --ignore to explicit paths, so it cannot be done here).
#
# Legacy tests (app/tests, app/calibration, app/reliability) are script-style,
# hit the real DATABASE_URL, and are run as before: python -m app.tests.<name>
[pytest]
testpaths = app/v2/tests
addopts = -ra --strict-markers
python_files = test_*.py
