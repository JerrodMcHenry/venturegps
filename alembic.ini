# Alembic configuration for VentureGPS V2 ONLY.
#
# V2 owns PostgreSQL schema `v2` (and its version table v2.alembic_version).
# It never manages legacy `public` tables. See docs/v2/DATABASE_MIGRATIONS.md.
#
# Run from the repo root:  alembic upgrade head
# The target database is NOT configured here: env.py resolves it from
# V2_DATABASE_URL (else DATABASE_URL) and prints the host/database it will use.
[alembic]
script_location = %(here)s/app/v2/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally unset.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
