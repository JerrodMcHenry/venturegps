# Render Blueprint for SIE Core Platform staging -- backend web service +
# managed Postgres, defined together so both can be created from this one
# file instead of manual dashboard clicking. This provisions
# infrastructure only; it does not deploy anything by itself and nothing
# here runs until this Blueprint is connected in the Render dashboard.
#
# OPENAI_API_KEY / TAVILY_API_KEY / CORS_ALLOWED_ORIGINS are intentionally
# left with `sync: false` -- Render will prompt for their values in the
# dashboard rather than have them appear in this committed file. See
# DEPLOYMENT.md for the full staging runbook, including what to set
# CORS_ALLOWED_ORIGINS to once the frontend's Vercel URL is known.
#
# EVIDENCE_V1_ENABLED defaults to "false" here (not a secret, so it's an
# explicit value rather than sync:false) so a fresh Blueprint deploy never
# accidentally enables the Evidence Engine v1 beta path before its table
# has been migrated -- see DEPLOYMENT.md's "Evidence Engine v1 database
# migrations" section for the manual migrate-then-enable ordering. Flip it
# to "true" in the Render dashboard only after that migration has run.
#
# CLERK_ISSUER, CLERK_AUTHORIZED_PARTIES, and ADMIN_USER_IDS are also
# required/used at runtime (see DEPLOYMENT.md's env var table) but are
# pre-existing omissions from this Blueprint, not something introduced
# here -- they must still be set by hand in the Render dashboard outside
# of this file until someone adds them here.
#
# Render's exact Blueprint schema keys occasionally change between
# documentation revisions -- if the dashboard flags a key on import,
# check Render's current Blueprint reference; the intent of every field
# below (build/start commands, env vars, and the database link) stays the
# same regardless of minor schema renames.

databases:
  - name: sie-staging-db
    plan: free
    databaseName: sie_staging
    user: sie_staging

services:
  - type: web
    name: sie-backend-staging
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        fromDatabase:
          name: sie-staging-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EVIDENCE_V1_ENABLED
        value: "false"
