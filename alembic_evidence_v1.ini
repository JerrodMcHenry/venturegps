# Alembic configuration for Evidence Engine v1 product persistence ONLY.
#
# Why this is a SECOND, independent Alembic environment rather than a table
# added to app/v2/migrations/ (full rationale:
# docs/architecture/EVIDENCE_ENGINE_PRODUCT_INTEGRATION.md
# "Why two Alembic environments"):
#
#   - app/v2/migrations/env.py's target metadata is constructed with
#     schema="v2" baked into the MetaData object itself
#     (app/v2/db/metadata.py); any table registered on it is namespaced
#     into v2, unconditionally.
#   - app/v2/db/scope.py's include_name/include_object are a fail-closed
#     allowlist for schema "v2" ONLY -- the default/public schema is
#     explicitly excluded ("legacy public tables are never reflected").
#   - V2's downgrade-to-base path DROPS the entire v2 schema
#     (_teardown_if_reverted_to_base in env.py) -- an unrelated table's
#     migration history must never be entangled with that lifecycle.
#
# Evidence Engine v1 is not part of the V2 subsystem (app/v2/) and this
# environment never touches it: it owns exactly one table
# (evidence_v1_analyses), in the default/public schema (no new Postgres
# schema), tracked by its own version table (evidence_v1_alembic_version,
# also default schema) so its migration history can never collide with
# v2.alembic_version. It targets DATABASE_URL directly -- the SAME
# database the legacy app and (by default) V2 use, schema-separated from
# V2 by convention, not by a second database.
#
# This environment NEVER mutates the legacy analyses table, is never run
# at import time or FastAPI startup (matching V2's own "run manually"
# convention), and does not use autogenerate -- each revision is a small,
# hand-written, explicit migration.
#
# Run from the repo root:  alembic -c alembic_evidence_v1.ini upgrade head
[alembic]
script_location = %(here)s/app/evidence_v1/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally unset -- env.py resolves DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
